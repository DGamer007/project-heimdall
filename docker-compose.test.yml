name: heimdall-test

services:
  postgres:
    image: postgres:13.2-alpine
    restart: always
    environment:
      POSTGRES_USER: $DATABASE_POSTGRES_USER
      POSTGRES_PASSWORD: $DATABASE_POSTGRES_PASSWORD
      POSTGRES_DB: $DATABASE_POSTGRES_DB_NAME
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U $DATABASE_POSTGRES_USER -d $DATABASE_POSTGRES_DB_NAME']
      interval: 15s
      timeout: 1m
      retries: 3
      start_period: 30s
    expose:
      - 5432
    ports:
      - "${DATABASE_POSTGRES_PORT}:5432"
  redis:
    image: redis:alpine3.23
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 15s
      timeout: 1m
      retries: 3
      start_period: 30s
    expose:
      - 6379
    ports:
      - "${DATABASE_REDIS_PORT}:6379"
